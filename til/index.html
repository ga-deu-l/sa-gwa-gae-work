<title>사과개 서식지</title>

<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#3B2A26; --sub:#8C7A74; --line:#F0E3D8;
  --main:#E8493F; --main-deep:#C93A31; --main-soft:#FDE9E5; --leaf:#5BAA6A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55}
body{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;
  display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.5px}
.top .grow{flex:1}
.top .back{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.top .back:active{background:rgba(255,255,255,.18)}
.top .title{font-weight:700;font-size:16px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* notice */
.notice{margin:10px 14px 0;padding:10px 12px;background:var(--main-soft);border-radius:12px;font-size:13px;color:var(--main-deep);display:flex;gap:8px;align-items:center}

/* list */
.list{padding:10px 14px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.item:active{background:#fffaf6}
.item .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--main-deep);background:var(--main-soft);padding:2px 8px;border-radius:999px;margin-bottom:6px}
.item .tt{font-weight:700;font-size:16px;line-height:1.4;display:flex;gap:6px;align-items:baseline}
.item .tt .cm{color:var(--main);font-size:13px;font-weight:800;flex:none}
.item .pv{margin-top:4px;color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub)}
.meta .nick{font-weight:600;color:var(--ink)}
.meta .st{display:flex;align-items:center;gap:3px}
.meta .grow{flex:1}
.empty{text-align:center;color:var(--sub);padding:56px 0}

/* post */
.post{padding:16px 14px 6px}
.post .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--main-deep);background:var(--main-soft);padding:2px 8px;border-radius:999px}
.post h2{font-size:20px;line-height:1.4;margin:8px 0 10px;letter-spacing:-.3px}
.post .info{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--sub);padding-bottom:14px;border-bottom:1px solid var(--line)}
.post .info .nick{color:var(--ink);font-weight:700}
.post .body{padding:16px 0;font-size:16px;line-height:1.75;word-break:break-word}
.actions{display:flex;justify-content:center;gap:10px;padding:6px 0 18px}
.like{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;border:1.5px solid #8FC76B;color:#6DB33F;font-weight:700;transition:background .2s,color .2s,border-color .2s}
.like.on{background:var(--main);border-color:var(--main);color:#fff}
.nav button{position:relative}
.nav .badge{position:absolute;top:3px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--main);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

/* comments */
.cmhead{padding:14px;font-weight:800;border-top:8px solid var(--line);background:var(--bg)}
.cmhead span{color:var(--main)}
.cm-item{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.cm-item.re{padding-left:34px;background:#fffbf7;position:relative}
.cm-item.re::before{content:"↳";position:absolute;left:16px;top:12px;color:var(--sub)}
.cm-item .h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.cm-item .h b{color:var(--ink)}
.cm-item .op{font-size:11px;font-weight:800;color:#fff;background:var(--leaf);padding:1px 6px;border-radius:999px}
.cm-item .h .grow{flex:1}
.cm-item .t{margin-top:4px;word-break:break-word}
.cm-item .lk{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:3px}

/* comment write (dropdown) */
.cw{padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.cw-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;color:var(--sub)}
.cw-toggle.on{border-color:var(--main);color:var(--main)}
.cw-arrow{transition:transform .2s}
.cw-toggle.on .cw-arrow{transform:rotate(180deg)}
.cw-panel{margin-top:10px;animation:drop .2s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cw-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cw-opt{text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:2px}
.cw-opt b{font-size:12px;color:var(--main-deep)}
.cw-opt span{font-size:14px;color:var(--ink)}
.cw-opt.on{border-color:var(--main);background:var(--main-soft)}
.cw textarea{width:100%;min-height:72px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none;resize:vertical;line-height:1.6}
.cw textarea:focus{border-color:var(--main)}
.cw-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cw-me{font-size:12.5px;color:var(--sub)}
.cw-foot .btn{height:38px}
.cw-opt .ar{font-size:11px;color:var(--sub);margin-left:2px}
.cw-tones{margin:-2px 0 2px 10px;padding-left:10px;border-left:2px solid var(--main-soft);display:flex;flex-direction:column;gap:6px;animation:drop .2s ease}
.cw-tone{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;gap:8px;align-items:flex-start}
.cw-tone em{flex:none;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--sub);padding:2px 7px;border-radius:999px;margin-top:2px}
.cw-tone span{font-size:14px;line-height:1.5}
.cw-tone.on{border-color:var(--main);background:var(--main-soft)}
.cw-tone.on em{background:var(--main)}
.cw-note{font-size:12px;color:var(--sub);margin-top:6px}
.btn:disabled{opacity:.4;cursor:default}
.cw-reset{width:100%;padding:10px;border-radius:12px;border:1px dashed var(--sub);color:var(--sub);font-size:13.5px;font-weight:600}
.cm-item .me-b{font-size:11px;font-weight:800;color:#fff;background:var(--main);padding:1px 6px;border-radius:999px}
.cm-item.fresh{animation:drop .3s ease}
.typing{padding:12px 14px 12px 34px;font-size:13px;color:var(--sub);background:#fffbf7;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px}
.typing b{color:var(--ink)}
.dots{display:inline-flex;gap:3px;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--sub);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.btn{padding:0 18px;border-radius:999px;background:var(--main);color:#fff;font-weight:700}
.btn:active{background:var(--main-deep)}

/* write */
.form{padding:14px}
.form label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.form select,.form input,.form textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.form textarea{min-height:240px;resize:vertical;line-height:1.7}
.form select:focus,.form input:focus,.form textarea:focus{border-color:var(--main)}
.form .who{font-size:13px;color:var(--sub);margin-top:8px}
.form .submit{width:100%;margin-top:18px;height:50px;font-size:16px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--sub)}
.nav button.on{color:var(--main)}
.nav .write{color:#fff}
.nav .write i{width:38px;height:38px;border-radius:50%;background:var(--main);display:grid;place-items:center;margin-top:-14px;box-shadow:0 4px 10px rgba(232,73,63,.35)}
.nav .write span{color:var(--sub)}

/* notifications */
.top .readall{color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2)}
.noti-list{padding-top:4px}
.noti-item{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--line);background:var(--card)}
.noti-item.new{background:var(--main-soft)}
.noti-item:active{filter:brightness(.97)}
.noti-ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:17px}
.noti-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.noti-tx .m{font-size:14.5px;line-height:1.45}
.noti-tx .p{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.noti-tx .tm{font-size:12px;color:var(--sub);margin-top:4px}
.noti-item .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--main);margin-top:6px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
.top .logo .emo{font-size:24px;line-height:1}
/* LIVE */
.live-b{flex:none;align-self:center;font-size:10.5px;font-weight:800;color:#fff;background:#FF3B30;padding:1px 6px;border-radius:4px;letter-spacing:.5px}
.live-b.end{background:var(--sub)}
.live-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#2B1F1C;color:#fff;font-size:13px;font-weight:700}
.live-bar.end{background:#8C7A74}
.live-dot{width:8px;height:8px;border-radius:50%;background:#FF4B3E;animation:blink 1.2s infinite}
.live-bar.end .live-dot{background:#eee;animation:none}
.cm-item.upd{background:#FFF4F2;border-left:3px solid var(--main)}
.cm-item.upd .t{font-size:15.5px}
.live-end{text-align:center;color:var(--sub);font-size:12.5px;padding:14px;background:var(--card);border-bottom:1px solid var(--line)}
.cw.live-cw{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:25;box-shadow:0 -6px 14px rgba(59,42,38,.08);border-top:1px solid var(--line)}
.cw.live-cw .cw-opts{max-height:40vh;overflow:auto;overscroll-behavior:contain}
/* LIVE 본문 */
.post.live{padding-bottom:110px}
.post.live h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post.live h2 .live-b{font-size:11px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.post.live h2 .live-b::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.post.live h2 .live-b.end::before{animation:none;opacity:.7}
.lv{padding:6px 0 0;border-top:1px solid var(--line)}
.lv p{margin:0 0 12px;word-break:break-word}
.lv .lv-a{font-size:16px;line-height:1.75;color:var(--ink)}
.lv .lv-c{font-size:14.5px;line-height:1.6;color:#7A6862;padding-left:10px;border-left:2px solid var(--line)}
.lv .lv-c b{font-size:13px;font-weight:700;color:#5A4843;margin-right:6px}
.lv .lv-c.me{color:var(--main);border-left-color:var(--main)}
.lv .lv-c.me b{color:var(--main)}
.lv .fresh{animation:drop .3s ease}
.lv .lv-typing{font-size:13px;color:var(--sub);display:flex;align-items:center}
.lv .lv-end{text-align:center;color:var(--sub);font-size:12.5px;margin-top:16px}
.post .body,.lv .lv-a{line-height:var(--lh,1.75)}
.lv p{margin-bottom:var(--gap,12px)}
.lv-gap{height:calc(var(--gap,12px) + 4px)}
.lv-re{display:inline-block;font-size:12px;font-weight:600;color:var(--sub);border:1px dashed #CDBFB9;border-radius:999px;padding:3px 10px;margin:-4px 0 12px 12px;background:#fff}
.lv-pick{margin:4px 0 14px;padding:12px;border:1.5px solid var(--main);border-radius:14px;background:#fff;animation:drop .25s ease}
.lv-pick-h{font-weight:800;font-size:14px;margin-bottom:10px;color:var(--main-deep)}
.lv-pick-h small{font-weight:500;color:var(--sub);margin-left:4px}
.lv-pick textarea{width:100%;min-height:72px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none;resize:vertical;line-height:1.6;margin-bottom:4px}
.fs-sm{font-size:.85em}.fs-lg{font-size:1.25em}.fs-xl{font-size:1.6em;line-height:1.3}
.lv .lv-c .col{color:#B3A49E;margin:0 5px 0 1px}
.lv .lv-c.me .col{color:var(--main)}
/* write by choice */
.w-guide{font-weight:800;font-size:16px;margin:4px 0 10px}
.cw-tone span b{display:block;font-size:14px;color:var(--ink)}
.cw-tone span small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.w-prev{margin-top:6px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);animation:drop .2s ease}
.w-prev .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--main-deep);background:var(--main-soft);padding:2px 8px;border-radius:999px}
.w-prev h3{font-size:17px;margin:8px 0 6px;line-height:1.4}
.w-prev div{font-size:14.5px;line-height:1.7;color:var(--ink)}
.form .cw-note{margin-top:8px}
.w-re{margin:0 0 14px}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 글자 꾸미기: [b] [i] [u] [s] [color=#색] [size=sm|lg|xl]
const deco = s => esc(s)
  .replace(/\[(\/?)(b|i|u|s)\]/g, '<$1$2>')
  .replace(/\[color=(#[0-9a-fA-F]{3,8})\]/g, '<span style="color:$1">').replace(/\[\/color\]/g, '</span>')
  .replace(/\[size=(sm|lg|xl)\]/g, '<span class="fs-$1">').replace(/\[\/size\]/g, '</span>');
const plain = s => String(s ?? '').replace(/\[\/?(b|i|u|s|color(=[^\]]*)?|size(=[^\]]*)?)\]/g, '');
const nl = s => deco(s).replace(/\n/g, '<br>');
const shortTx = s => { const t = plain(s).split('\n')[0].trim(); return t.length > 40 ? t.slice(0, 40) + '…' : t; };
// 알림: 연결된 댓글(ref)이 있으면 지금 댓글 내용으로 문구를 만들어요
function notiText(n){
  const p = DATA.posts.find(x => x.id === n.postId);
  // 추천 알림: 연결된 글의 추천수를 그대로 따라가요 (직접 쓰기로 바꾼 알림만 count 사용)
  if (n.type === 'like') return `사과 ${n.sync !== false && p ? (+p.likes || 0) + (S.liked[p.id] ? 1 : 0) : (+n.count || 0)}개 수확!`;
  const pool = p ? (p.comments || []).concat(((p.live && p.live.lines) || []).filter(l => l.type === 'comment')) : [];
  const c = n.ref && pool.find(x => x.cid === n.ref);
  return c ? `${c.nick}님이 ${n.type === 'reply' ? '답글' : '댓글'}을 달았어요: ${shortTx(c.text)}` : plain(n.text);
}
const boardName = id => (DATA.boards.find(b => b.id === id) || {name:''}).name;
const TONES = DATA.tones || [];
(() => { const st = DATA.style || {}, r = document.documentElement.style;
  r.setProperty('--lh', +st.lineHeight || 1.75); r.setProperty('--gap', (st.gap == null ? 12 : +st.gap) + 'px'); })();
const NOTI = DATA.notifications || [];
DATA.posts = DATA.posts || []; DATA.writeChoices = DATA.writeChoices || [];

const I = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  fire:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
  pen:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  bell:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  apple:'<svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7.5c-2.2-1.6-7.5-1.2-7.5 5 0 5 3.2 9 5.4 9 1 0 1.5-.6 2.1-.6s1.1.6 2.1.6c2.2 0 5.4-4 5.4-9 0-6.2-5.3-6.6-7.5-5z"/><path fill="#5BAA6A" d="M12 7.5c0-2.3 1.2-4.3 3.5-4.5 0 2.4-1.2 4.4-3.5 4.5z"/></svg>',
  appleL:'<svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M12 7.5c-2.2-1.6-7.5-1.2-7.5 5 0 5 3.2 9 5.4 9 1 0 1.5-.6 2.1-.6s1.1.6 2.1.6c2.2 0 5.4-4 5.4-9 0-6.2-5.3-6.6-7.5-5z"/><path fill="#5BAA6A" d="M12 7.5c0-2.3 1.2-4.3 3.5-4.5 0 2.4-1.2 4.4-3.5 4.5z"/></svg>',
  eye:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  logo:'<span class="emo">🍎</span>'
};

const S = { view:'home', tab:'home', board:'all', postId:null, liked:{}, from:'home',
            cwOpen:null, cwPick:null, cwTone:null, typing:{}, wPick:null, wTone:null, wUsed:{} };
try { if (window.__INIT) Object.assign(S, window.__INIT); } catch(e) {}

const unread = () => NOTI.filter(n => !n.read).length;
const NOTI_IC = { comment:'💬', reply:'↪️', like:'🍎', notice:'📢' };
const nextId = () => Math.max(0, ...DATA.posts.map(p => +p.id || 0)) + 1;
const busy = () => { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox')); };
const keep = force => { if (!force && busy()) return; const y = scrollY; render(); scrollTo(0, y); };
// 댓글 말투 값: "문장" 또는 { text, replies }
const tv = v => !v ? null : typeof v === 'string' ? (v.trim() ? { text:v, replies:null } : null)
                          : ((v.text || '').trim() ? { text:v.text, replies:v.replies || null } : null);
// 글 말투 값: { title, body }
const wtv = v => v && (v.title || '').trim() ? v : null;
const hasText = r => (r.text || '').trim();
const meOf = p => (p && p.me) || DATA.me;   // 이 글에서 신청자 닉네임
const isLive = p => !!(p && p.live && p.live.on);
const liveEnded = p => p._done && p.live.endMark !== false;
const clock = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
function currentPost(){ return DATA.posts.find(p => p.id === S.postId); }

function topbar(){
  if (S.view === 'post' || S.view === 'write') {
    return `<header class="top"><button class="back" data-act="back" aria-label="뒤로">${I.back}</button>
      <div class="title">${S.view==='write' ? '글쓰기' : esc(boardName((currentPost()||{}).board) || '게시글')}</div></header>`;
  }
  if (S.view === 'noti') {
    return `<header class="top"><div class="title" style="padding-left:4px">알림</div><div class="grow"></div>
      ${unread() ? '<button class="readall" data-act="readall">모두 읽음</button>' : ''}</header>`;
  }
  return `<header class="top"><div class="logo">${I.logo}${esc(DATA.site.name)}</div><div class="grow"></div></header>`;
}

function nav(){
  const on = k => (S.view === 'home' || S.view === 'noti') && S.tab === k ? 'on' : '';
  const n = unread();
  return `<nav class="nav">
    <button class="${on('home')}" data-act="tab" data-v="home">${I.home}<span>홈</span></button>
    <button class="${on('hot')}" data-act="tab" data-v="hot">${I.fire}<span>인기</span></button>
    <button class="write" data-act="write"><i>${I.pen}</i><span>글쓰기</span></button>
    <button class="${on('noti')}" data-act="bell">${I.bell}${n>0?`<b class="badge">${n}</b>`:''}<span>알림</span></button>
  </nav>`;
}

function listView(){
  let posts = DATA.posts.slice();
  if (S.tab === 'hot') posts.sort((a,b) => b.likes - a.likes);
  if (S.board === '__live') posts = posts.filter(isLive);
  else if (S.board !== 'all') posts = posts.filter(p => p.board === S.board);
  const chips = [{id:'all',name:'전체'}, {id:'__live',name:'🔴 LIVE'}, ...DATA.boards]
    .map(b => `<button class="chip ${S.board===b.id?'on':''}" data-act="board" data-v="${esc(b.id)}">${esc(b.name)}</button>`).join('');
  const items = posts.length ? posts.map(p => `
    <button class="item" data-act="open" data-v="${p.id}">
      <span class="tag">${esc(boardName(p.board))}</span>
      <div class="tt">${isLive(p) ? `<span class="live-b ${liveEnded(p)?'end':''}">LIVE</span>` : ''}<span>${deco(p.title)}</span>${p.comments.length ? `<span class="cm">[${p.comments.length}]</span>` : ''}</div>
      <div class="pv">${esc(plain(p.body).replace(/\n+/g,' '))}</div>
      <div class="meta"><span class="nick">${esc(p.nick)}</span><span>${esc(p.time)}</span><span class="grow"></span>
        <span class="st">${I.eye}${p.views}</span><span class="st" style="color:var(--main)">${I.apple}${p.likes}</span></div>
    </button>`).join('') : `<div class="empty">${S.board === '__live' ? '지금 진행되는 라이브가 없어요' : '아직 작성된 글이 없어요'}</div>`;
  return `${topbar()}
    ${DATA.site.notice ? `<div class="notice">${deco(DATA.site.notice)}</div>` : ''}
    <div class="chips">${chips}</div><div class="list">${items}</div>${nav()}`;
}

// LIVE 글: 제목 + 본문 줄글만. 한 줄씩 올라오고, 선택 댓글 자리에선 멈춰서 댓글을 고르게 해요
function livePostView(p){
  const F = p._feed || [];
  const flow = F.map((f, i) => f.k === 'gap' ? '<div class="lv-gap"></div>'
    : (f.k === 'text' && !f.mine) ? `<p class="lv-a ${f.fresh ? 'fresh' : ''}">${nl(f.text)}</p>`
    : `<p class="lv-c ${f.mine ? 'me' : ''} ${f.fresh ? 'fresh' : ''}"><b>${esc(f.nick)}</b><span class="col">:</span>${nl(f.text)}</p>`
      + (f.snap ? `<button class="lv-re" data-act="lvRepick" data-v="${i}">↺ 다른 댓글로 다시 써보기</button>` : '')).join('');
  return `${topbar()}
    <article class="post live">
      <h2><span class="live-b ${liveEnded(p)?'end':''}">${liveEnded(p) ? 'LIVE 종료' : 'LIVE'}</span>${deco(p.title)}</h2>
      <div class="lv">
        ${flow}
        ${S.typing[p.id] ? `<p class="lv-typing"><b>${esc(S.typing[p.id])}</b>님이 입력 중<span class="dots"><i></i><i></i><i></i></span></p>` : ''}
        ${p._wait ? lvPicker(p) : ''}
        ${liveEnded(p) ? '<p class="lv-end">— 라이브가 끝났어요 —</p>' : ''}
      </div>
    </article>
    ${writeBox(p)}
    ${nav()}`;
}
function lvSel(p){
  if (!p._wait || S.lpPick == null) return null;
  if (S.lpPick === 'free') return 'free';
  const c = p._wait.options[S.lpPick];
  const v = c && S.lpTone && c.tones ? tv(c.tones[S.lpTone]) : null;
  return v ? { text: v.text, replies: v.replies || c.replies || [] } : null;
}
function lvPicker(p){
  const valid = validChoices(p._wait.options), sel = lvSel(p);
  return `<div class="lv-pick"><div class="lv-pick-h">💬 여기서 댓글을 달아 주세요<small>라이브가 잠깐 멈췄어요</small></div>
    <div class="cw-opts">${valid.map(({c, i, ts}) => `
      <button class="cw-opt ${S.lpPick===i?'on':''}" data-act="lpPick" data-v="${i}">
        <b>${esc(c.label || (i+1)+'번 댓글')} <span class="ar">${S.lpPick===i?'▾':'▸'}</span></b>${c.summary ? `<span>${deco(c.summary)}</span>` : ''}</button>
      ${S.lpPick===i ? `<div class="cw-tones">${ts.map(({t, v}) =>
        `<button class="cw-tone ${S.lpTone===t.id?'on':''}" data-act="lpTone" data-v="${esc(t.id)}"><em>${esc(t.name)}</em><span>${deco(v.text)}</span></button>`).join('')}</div>` : ''}`).join('')}
      ${DATA.allowFree ? `<button class="cw-opt ${S.lpPick==='free'?'on':''}" data-act="lpPick" data-v="free"><b>직접 쓰기 <span class="ar">${S.lpPick==='free'?'▾':'▸'}</span></b><span>내 말로 자유롭게 쓰기</span></button>` : ''}
    </div>
    ${S.lpPick === 'free' ? '<textarea id="lpText" maxlength="300" placeholder="댓글을 입력하세요"></textarea>' : ''}
    <div class="cw-foot"><span class="cw-me">${sel ? esc(meOf(p)) + '(으)로 등록' : '댓글과 말투를 골라주세요'}</span>
      <button class="btn" data-act="lpSend" ${sel ? '' : 'disabled'}>등록</button></div></div>`;
}

function postView(){
  const p = currentPost(); if (!p) { S.view='home'; return listView(); }
  if (isLive(p)) return livePostView(p);
  const liked = !!S.liked[p.id];
  const cms = p.comments.map(c => `
    <div class="cm-item ${c.reply?'re':''} ${c.upd?'upd':''} ${c.fresh?'fresh':''}">
      <div class="h"><b>${esc(c.nick)}</b>${c.nick===p.nick ? '<span class="op">글쓴이</span>' : ''}${(c.mine || c.nick===meOf(p)) ? '<span class="me-b">나</span>' : ''}<span>${esc(c.time)}</span><span class="grow"></span>
        <span class="lk">${I.apple}${c.likes||0}</span></div>
      <div class="t">${nl(c.text)}</div>
    </div>`).join('');
  return `${topbar()}
    <article class="post">
      <span class="tag">${esc(boardName(p.board))}</span>
      <h2>${deco(p.title)}</h2>
      <div class="info"><span class="nick">${esc(p.nick)}</span><span>${esc(p.time)}</span><span style="flex:1"></span><span>조회 ${p.views}</span></div>
      <div class="body">${nl(p.body)}</div>
      <div class="actions"><button class="like ${liked?'on':''}" data-act="like">${I.appleL}<span>${p.likes + (liked?1:0)}</span></button></div>
      ${p.fromW != null ? '<button class="cw-reset w-re" data-act="wRepick">↺ 다른 글로 다시 써보기</button>' : ''}
    </article>
    ${isLive(p) ? (liveEnded(p) ? '<div class="live-bar end"><span class="live-dot"></span>LIVE 종료</div>'
        : `<div class="live-bar"><span class="live-dot"></span>LIVE 진행 중<span style="flex:1"></span><span>👀 ${p.views}</span></div>`) : ''}
    <div class="cmhead">${isLive(p) ? '실시간 댓글' : '댓글'} <span>${p.comments.length}</span></div>
    ${cms || (S.typing[p.id] ? '' : '<div class="empty" style="padding:28px 0">첫 댓글을 남겨보세요</div>')}
    ${S.typing[p.id] ? `<div class="typing"><b>${esc(S.typing[p.id])}</b>님이 ${isLive(p) ? '입력' : '댓글 쓰는'} 중<span class="dots"><i></i><i></i><i></i></span></div>` : ''}
    ${isLive(p) && liveEnded(p) ? '<div class="live-end">— 라이브가 끝났어요 —</div>' : ''}
    ${writeBox(p)}
    ${nav()}`;
}

// 고를 수 있는 선택지만 (말투 문장이 하나라도 있는 것)
const validChoices = list => (list || []).map((c, i) => ({ c, i,
  ts: TONES.map(t => ({ t, v: tv(c.tones && c.tones[t.id]) })).filter(x => x.v) })).filter(x => x.ts.length);

function writeBox(p){
  if (S.typing[p.id] && !isLive(p)) return '';
  if (isLive(p) && p._wait) return '';
  if (p.chosen != null && !isLive(p))
    return `<div class="cw"><button class="cw-reset" data-act="repick">↺ 다른 댓글로 다시 써보기</button></div>`;
  const valid = validChoices(p.choices).filter(x => !(p._used && p._used[x.i]));
  const open = S.cwOpen === p.id;
  const freeBox = `<textarea id="cwText" maxlength="300" placeholder="댓글을 입력하세요"></textarea>
      ${valid.length ? '<div class="cw-note">직접 쓴 댓글엔 대댓글이 달리지 않아요</div>' : ''}
      <div class="cw-foot"><span class="cw-me">${esc(meOf(p))}(으)로 등록</span><button class="btn" data-act="cwsend">등록</button></div>`;
  let panel = '';
  if (open && !valid.length) panel = freeBox;
  else if (open) {
    const sel = toneSel(p);
    panel = `<div class="cw-opts">${valid.map(({c, i, ts}) => `
        <button class="cw-opt ${S.cwPick===i?'on':''}" data-act="pick" data-v="${i}">
          <b>${esc(c.label || (i+1)+'번 댓글')} <span class="ar">${S.cwPick===i?'▾':'▸'}</span></b>${c.summary ? `<span>${deco(c.summary)}</span>` : ''}</button>
        ${S.cwPick===i ? `<div class="cw-tones">${ts.map(({t, v}) =>
            `<button class="cw-tone ${S.cwTone===t.id?'on':''}" data-act="tone" data-v="${esc(t.id)}"><em>${esc(t.name)}</em><span>${deco(v.text)}</span></button>`).join('')}</div>` : ''}`).join('')}
        ${DATA.allowFree ? `<button class="cw-opt ${S.cwPick==='free'?'on':''}" data-act="pick" data-v="free"><b>직접 쓰기 <span class="ar">${S.cwPick==='free'?'▾':'▸'}</span></b><span>내 말로 자유롭게 쓰기</span></button>` : ''}
      </div>
      ${S.cwPick==='free' ? freeBox : `
      <div class="cw-foot"><span class="cw-me">${sel ? esc(meOf(p))+'(으)로 등록' : '내용과 말투를 골라주세요'}</span>
        <button class="btn" data-act="cwsend" ${sel ? '' : 'disabled'}>등록</button></div>`}`;
  }
  return `<div class="cw ${isLive(p) ? 'live-cw' : ''}">
    <button class="cw-toggle ${open?'on':''}" data-act="cwtoggle"><span>✏️ 댓글 쓰기</span><span class="cw-arrow">▾</span></button>
    ${open ? `<div class="cw-panel">${panel}</div>` : ''}
  </div>`;
}

function toneSel(p){
  const c = (p.choices || [])[S.cwPick];
  if (!c || !S.cwTone || !c.tones) return null;
  const v = tv(c.tones[S.cwTone]); if (!v) return null;
  return { text: v.text, replies: v.replies || c.replies || [] };
}

// 댓글을 하나씩 순서대로 달아요
function playSeq(p, list, done){
  let i = 0;
  const step = () => {
    if (i >= list.length){ delete S.typing[p.id]; if (done) done(); keep(); return; }
    const r = list[i];
    S.typing[p.id] = r.nick || '익명'; keep();
    p._timer = setTimeout(() => {
      p.comments.forEach(c => c.fresh = false);
      p.comments.push({ nick:r.nick, time:'방금', text:r.text, likes:+r.likes || 0, reply:!!r.reply, fresh:true });
      i++; delete S.typing[p.id]; keep();
      p.comments.forEach(c => c.fresh = false);
      p._timer = setTimeout(step, 500);
    }, +r.delay || 1500);
  };
  p._timer = setTimeout(step, 600);
}

// ── LIVE: 본문과 라이브 내용을 한 줄씩. 반응(대댓글)은 먼저 끼어들고, 선택 댓글 자리에선 멈춰요 ──
function lvCompile(p){
  const sp = +p.live.lineSpeed || 900, out = [];
  const addText = (t, first, cont) => String(t || '').replace(/\s+$/, '').split('\n').forEach((ln, i) => {
    out.push(ln.trim() ? { k:'text', nick:p.nick, text:ln, wait: i === 0 ? first : sp, cont: cont || i > 0 }
                       : { k:'gap', wait: Math.min(sp, 300), cont:true });
  });
  if ((p.body || '').trim()) addText(p.body, 0, true);
  (p.comments || []).filter(hasText).forEach(c => out.push(c.nick === p.nick
    ? { k:'text', nick:c.nick, text:c.text, wait:700, cont:true } : { k:'cmt', nick:c.nick, text:c.text, wait:700, cont:true }));
  ((p.live && p.live.lines) || []).forEach(l => {
    if (l.type === 'pick'){ if (validChoices(l.options).length) out.push({ k:'pick', options:l.options, wait: +l.delay || 800 }); return; }
    if (!hasText(l)) return;
    const nick = l.nick || p.nick;
    if (l.type === 'comment' && nick !== p.nick) out.push({ k:'cmt', nick, text:l.text, wait: +l.delay || 2000 });
    else addText(l.text, +l.delay || 2500, false);
  });
  return out;
}
const lvReplies = (p, list) => (list || []).filter(hasText).map(r => { const n = r.nick || p.nick;
  return { k: n === p.nick ? 'text' : 'cmt', nick: n, text: r.text, wait: +r.delay || 1500 }; });
function liveRender(p, appended){
  if (S.view === 'post' && S.postId === p.id){
    if (busy()) return;
    const el = document.documentElement, near = innerHeight + scrollY >= el.scrollHeight - 160, y = scrollY;
    render(); scrollTo(0, appended && near ? el.scrollHeight : y);
  } else if (S.view === 'home') keep();
  (p._feed || []).forEach(f => f.fresh = false);     // 등장 효과는 처음 한 번만
}
function liveStart(p){
  if (!isLive(p)) return;
  if (!p._script){ p._script = lvCompile(p); p._si = 0; p._feed = []; p._q = []; p._wait = null; }
  if (p._run || p._done || p._wait) return;
  p._run = true; lvNext(p, +p.live.startDelay || 1200);
}
function lvNext(p, first){
  const nx = p._q.length ? p._q[0] : (p._wait ? null : p._script[p._si]);
  if (!nx){
    p._run = false; delete S.typing[p.id];
    if (!p._wait) p._done = true;
    liveRender(p, true); return;
  }
  const wait = (first || 0) + (nx.wait || 0);
  if (nx.k === 'pick'){
    p._lt = setTimeout(() => { p._si++; p._wait = { options: nx.options, si: p._si - 1 }; p._run = false;
      S.lpPick = null; S.lpTone = null; liveRender(p, true); }, wait);
    return;
  }
  if (!nx.cont && nx.k !== 'gap' && wait >= 700){ S.typing[p.id] = nx.nick || p.nick; liveRender(p); }
  p._lt = setTimeout(() => {
    const r = p._q.length ? p._q.shift() : p._script[p._si++];
    p._feed.push({ k: r.k, nick: r.nick, text: r.text, fresh: true });
    delete S.typing[p.id]; liveRender(p, true);
    lvNext(p);
  }, wait);
}
function lvRun(p){ clearTimeout(p._lt); delete S.typing[p.id]; p._done = false; p._run = true; lvNext(p); }
// 하단 댓글창에서 쓴 댓글: 지금 위치에 붙고, 반응이 먼저 이어져요
function lvBoxSend(p, text, replies, ci){
  if (!p._script) liveStart(p);
  p._feed.push({ k:'cmt', nick: meOf(p), text, mine: true, fresh: true,
                 snap: ci == null ? null : { feedLen: p._feed.length, si: p._si, wait: p._wait, ci } });
  liveRender(p, true);
  const add = lvReplies(p, replies);
  if (add.length){ p._q = p._q.concat(add); lvRun(p); }
}

function writeView(){
  const all = DATA.writeChoices;
  const opts = DATA.boards.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('');
  const freeForm = `
      <label>게시판</label><select id="wBoard">${opts}</select>
      <label>제목</label><input id="wTitle" placeholder="제목을 입력하세요" maxlength="60">
      <label>내용</label><textarea id="wBody" placeholder="내용을 입력하세요"></textarea>
      ${all.length ? '<div class="cw-note">직접 쓴 글엔 준비된 댓글이 달리지 않아요</div>' : ''}
      <div class="who">작성자: ${esc(DATA.me)} (익명)</div>
      <button class="btn submit" data-act="submit">등록하기</button>`;
  const wc = all.map((w, i) => ({ w, i, ts: TONES.map(t => ({ t, v: wtv(w.tones && w.tones[t.id]) })).filter(x => x.v) }))
                .filter(x => x.ts.length && !S.wUsed[x.i]);
  if (!wc.length && !all.length) return `${topbar()}<div class="form">${freeForm}</div>${nav()}`;
  const sel = wSel();
  const list = (wc.length || DATA.allowFree) ? `<div class="cw-opts">
      ${wc.map(({w, i, ts}) => `
        <button class="cw-opt ${S.wPick===i?'on':''}" data-act="wpick" data-v="${i}">
          <b>${esc(w.label || (i+1)+'번 글')} <span class="ar">${S.wPick===i?'▾':'▸'}</span></b>${w.summary ? `<span>${deco(w.summary)}</span>` : ''}</button>
        ${S.wPick===i ? `<div class="cw-tones">${ts.map(({t, v}) =>
          `<button class="cw-tone ${S.wTone===t.id?'on':''}" data-act="wtone" data-v="${esc(t.id)}"><em>${esc(t.name)}</em><span><b>${deco(v.title)}</b>${v.body ? `<small>${esc(plain(v.body).split('\n')[0])}</small>` : ''}</span></button>`).join('')}</div>` : ''}`).join('')}
      ${DATA.allowFree ? `<button class="cw-opt ${S.wPick==='free'?'on':''}" data-act="wpick" data-v="free"><b>직접 쓰기 <span class="ar">${S.wPick==='free'?'▾':'▸'}</span></b><span>내 말로 자유롭게 쓰기</span></button>` : ''}
    </div>` : '<div class="empty">더 쓸 수 있는 글이 없어요 🍎</div>';
  const bottom = S.wPick === 'free' ? freeForm
    : sel ? `<div class="w-prev"><span class="tag">${esc(boardName(sel.board))}</span><h3>${deco(sel.title)}</h3><div>${nl(sel.body)}</div></div>
             <button class="btn submit" data-act="wsubmit">등록하기</button>`
    : wc.length ? '<button class="btn submit" disabled>내용과 말투를 골라주세요</button>' : '';
  return `${topbar()}<div class="form"><div class="w-guide">어떤 글을 쓸까요?</div>${list}${bottom}</div>${nav()}`;
}

function wSel(){
  const w = DATA.writeChoices[S.wPick];
  if (!w || !S.wTone || !w.tones) return null;
  const v = wtv(w.tones[S.wTone]); if (!v) return null;
  return { w, board: w.board || (DATA.boards[0] || {}).id, title: v.title, body: v.body || '' };
}

function notiView(){
  const items = NOTI.length ? NOTI.map((n, i) => {
    const p = DATA.posts.find(x => x.id === n.postId);
    return `<button class="noti-item ${n.read?'':'new'}" data-act="noti" data-v="${i}">
      <span class="noti-ic">${NOTI_IC[n.type] || '🔔'}</span>
      <span class="noti-tx">
        <span class="m">${esc(notiText(n))}</span>
        ${p ? `<span class="p">${deco(p.title)}</span>` : ''}
        <span class="tm">${esc(n.time)}</span>
      </span>
      ${n.read ? '' : '<span class="dot"></span>'}
    </button>`;
  }).join('') : '<div class="empty">알림이 없어요 🍎</div>';
  return `${topbar()}<div class="noti-list">${items}</div>${nav()}`;
}

function render(){
  const drafts = {}; ['cwText','lpText'].forEach(id => { const d = document.getElementById(id); if (d && d.value) drafts[id] = d.value; });
  $app.innerHTML = S.view==='post' ? postView() : S.view==='write' ? writeView() : S.view==='noti' ? notiView() : listView();
  Object.keys(drafts).forEach(id => { const d2 = document.getElementById(id); if (d2) d2.value = drafts[id]; });
  window.scrollTo(0,0);
  try { if (window.parent !== window) window.parent.postMessage({ sgState: {
    view: S.view==='write' ? 'home' : S.view, tab:S.tab, board:S.board, postId:S.postId, from:S.from } }, '*'); } catch(e) {}
}

const resetCw = () => { S.cwOpen = null; S.cwPick = null; S.cwTone = null; };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act==='tab'){ S.tab=v; S.view='home'; S.board='all'; render(); }
  else if (act==='board'){ S.board=v; render(); }
  else if (act==='open'){ S.from='home'; resetCw(); S.postId=+v; S.view='post'; render(); liveStart(currentPost()); }
  else if (act==='back'){ S.view=S.from; render(); }
  else if (act==='write'){ S.from = S.view==='noti' ? 'noti' : 'home'; S.wPick=null; S.wTone=null; S.view='write'; render(); }
  else if (act==='bell'){
    S.tab='noti'; S.view='noti'; render();
    const n = unread();
    toast(n ? `새 알림이 ${n}건 있어요` : '모든 알림을 확인했어요');
  }
  else if (act==='noti'){
    const n = NOTI[+v]; n.read = true;
    if (DATA.posts.some(p => p.id === n.postId)) { S.from='noti'; resetCw(); S.postId=n.postId; S.view='post'; render(); liveStart(currentPost()); }
    else render();
  }
  else if (act==='readall'){ NOTI.forEach(n => n.read = true); render(); toast('모든 알림을 확인했어요'); }
  else if (act==='like'){
    S.liked[S.postId] = !S.liked[S.postId]; keep(true);
    if (S.liked[S.postId]) toast('왕왕!');
  }
  // ── 댓글 ──
  else if (act==='cwtoggle'){ const o = S.cwOpen===S.postId; resetCw(); if (!o) S.cwOpen = S.postId; keep(true); }
  else if (act==='pick'){ const nv = v==='free' ? 'free' : +v; S.cwPick = S.cwPick===nv ? null : nv; S.cwTone = null; keep(true); }
  else if (act==='tone'){ S.cwTone = v; keep(true); }
  else if (act==='cwsend'){
    const p = currentPost(); let text, replies = null;
    const sel = toneSel(p);
    if (sel){ text = sel.text; replies = sel.replies.filter(hasText).map(r => ({ ...r, reply: r.reply!==false }));
              if (isLive(p)) (p._used = p._used || {})[S.cwPick] = true;
              else { p.chosen = S.cwPick; p.chosenAt = p.comments.length; } }
    else {
      const ta = document.getElementById('cwText'); text = ta ? ta.value.trim() : '';
      if (!text){ toast('댓글을 입력해 주세요'); return; }
    }
    if (isLive(p)){ const ci = sel ? S.cwPick : null; resetCw(); lvBoxSend(p, text, replies, ci); toast('댓글이 등록됐어요'); return; }
    p.comments.forEach(c => c.fresh = false);
    p.comments.push({ nick:meOf(p), time:'방금', text, likes:0, fresh:true, mine:true });
    resetCw(); keep(true); toast('댓글이 등록됐어요');
    p.comments.forEach(c => c.fresh = false);
    if (replies && replies.length) playSeq(p, replies, () => {
      const r = replies.find(x => x.nick !== meOf(p));
      if (r) NOTI.unshift({ type:'reply', postId:p.id, time:'방금', read:false, text:`${r.nick}님이 답글을 달았어요` });
    });
  }
  else if (act==='lpPick'){ const nv = v==='free' ? 'free' : +v; S.lpPick = S.lpPick===nv ? null : nv; S.lpTone = null; keep(true); }
  else if (act==='lpTone'){ S.lpTone = v; keep(true); }
  else if (act==='lpSend'){
    const p = currentPost(), w = p && p._wait, sel = p && lvSel(p); if (!w || !sel) return;
    let text, replies = [];
    if (sel === 'free'){ const ta = document.getElementById('lpText'); text = ta ? ta.value.trim() : ''; if (!text){ toast('댓글을 입력해 주세요'); return; } }
    else { text = sel.text; replies = sel.replies; }
    p._feed.push({ k:'cmt', nick: meOf(p), text, mine: true, fresh: true, snap: { feedLen: p._feed.length, si: w.si, pick: true } });
    p._wait = null; S.lpPick = null; S.lpTone = null;
    p._q = lvReplies(p, replies);
    liveRender(p, true); lvRun(p);
  }
  else if (act==='lvRepick'){
    const p = currentPost(), it = p && p._feed && p._feed[+v]; if (!it || !it.snap) return;
    clearTimeout(p._lt); delete S.typing[p.id];
    const sn = it.snap;
    p._feed.slice(sn.feedLen).forEach(f => { if (f.snap && f.snap.ci != null && p._used) p._used[f.snap.ci] = false; });
    p._feed.length = sn.feedLen; p._q = []; p._done = false; p._run = false;
    if (sn.pick){ p._si = sn.si + 1; p._wait = { options: p._script[sn.si].options, si: sn.si }; S.lpPick = null; S.lpTone = null; liveRender(p, true); }
    else { p._si = sn.si; p._wait = sn.wait || null; resetCw(); S.cwOpen = p.id; keep(true); if (!p._wait) lvRun(p); }
  }
  else if (act==='repick'){
    const p = currentPost(); clearTimeout(p._timer); delete S.typing[p.id];
    p.comments.length = p.chosenAt; p.chosen = null;
    resetCw(); S.cwOpen = p.id; keep(true);
  }
  // ── 글쓰기 ──
  else if (act==='wpick'){ const nv = v==='free' ? 'free' : +v; S.wPick = S.wPick===nv ? null : nv; S.wTone = null; keep(true); }
  else if (act==='wtone'){ S.wTone = v; keep(true); }
  else if (act==='wsubmit'){
    const sel = wSel(); if (!sel) return;
    const id = nextId();
    const wn = sel.w.nick || DATA.me;
    const p = { id, fromW: S.wPick, board: sel.board, nick: wn, me: wn, time:'방금', views: +sel.w.views || 1, likes: +sel.w.likes || 0, title: sel.title, body: sel.body,
                comments: [], choices: JSON.parse(JSON.stringify(sel.w.choices || [])) };
    DATA.posts.unshift(p); S.wUsed[S.wPick] = true;
    S.from='home'; resetCw(); S.postId=id; S.view='post'; render(); toast('글이 등록됐어요');
    const ac = (sel.w.autoComments || []).filter(hasText).map(c => ({ ...c, reply: !!c.reply }));
    if (ac.length) playSeq(p, ac, () => {
      NOTI.unshift({ type:'comment', postId:id, time:'방금', read:false, text:`내 글에 댓글이 ${ac.length}개 달렸어요` });
    });
  }
  else if (act==='wRepick'){   // 글쓰기 선택지로 쓴 글 되돌리기 → 다시 고르기
    const p = currentPost(); if (!p || p.fromW == null) return;
    clearTimeout(p._timer); delete S.typing[p.id];
    DATA.posts.splice(DATA.posts.indexOf(p), 1);
    for (let k = NOTI.length - 1; k >= 0; k--) if (NOTI[k].postId === p.id) NOTI.splice(k, 1);
    S.wUsed[p.fromW] = false; resetCw();
    S.wPick = null; S.wTone = null; S.from = 'home'; S.view = 'write'; render(); toast('다른 글을 골라 보세요');
  }
  else if (act==='submit'){
    const title = document.getElementById('wTitle').value.trim();
    const body = document.getElementById('wBody').value.trim();
    if (!title || !body){ toast('제목과 내용을 입력해 주세요'); return; }
    const id = nextId();
    DATA.posts.unshift({ id, board: document.getElementById('wBoard').value, nick: DATA.me, time:'방금', views:0, likes:0, title, body, comments:[], choices:[] });
    S.from='home'; resetCw(); S.postId = id; S.view='post'; render(); toast('글이 등록됐어요');
  }
});

render();
if (S.view === 'post' && currentPost()) liveStart(currentPost());
</script>
</body>
